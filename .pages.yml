# Pages CMS — editor visual para os artigos da Isabele Mariana Nails.
# Uso: https://app.pagescms.org/ (entrar com a conta poetajoad-alt)
# O conteúdo é gravado em content/blog/posts/*.json e publicado por GitHub Actions.
media:
  input: assets
  output: /assets
  categories: [image]
  rename: safe

content:
  - name: artigos
    label: Artigos do Blog
    type: collection
    path: content/blog/posts
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      primary: title
      sort: title
      order: asc
    fields:
      - name: title
        label: Título do artigo
        type: string
        required: true
      - name: slug
        label: Endereço amigável (sem espaços)
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: category
        label: Categoria
        type: string
        required: true
      - name: summary
        label: Resumo / chamada da listagem
        type: text
        required: true
      - name: seoTitle
        label: Título SEO
        type: string
        required: true
      - name: seoDescription
        label: Meta description
        type: text
        required: true
      - name: cover
        label: Imagem de capa
        type: image
        required: true
        options:
          path: assets/blog
      - name: coverAlt
        label: Texto ALT da imagem
        type: string
        required: true
      - name: coverCaption
        label: Legenda da imagem
        type: text
      - name: featured
        label: Destacar artigo no blog
        type: boolean
        description: Prioriza este artigo nos destaques do blog e da landing. Apenas artigos publicados aparecem no site.
      - name: published
        label: Aprovado para publicação
        type: boolean
        description: Ative somente depois que a Isabele aprovar o texto e a foto.
      - name: body
        label: Texto completo
        type: rich-text
        required: true
        options:
          format: html
          switcher: true
          # Permitir imagens dentro do texto, inclusive após H2 e H3.
          path: assets/blog
          rename: safe
          extensions: [jpg, jpeg, png, webp]
