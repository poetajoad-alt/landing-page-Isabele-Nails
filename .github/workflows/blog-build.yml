name: Blog Isabele - atualizar paginas do CMS

on:
  push:
    branches:
      - main
      - feat/blog-piloto-isabele-20261121
      - feat/blog-destaques-horizontal-20261121
    paths:
      - 'content/blog/posts/**'
      - 'templates/blog-article.html.tpl'
      - 'templates/blog-index.html.tpl'
      - 'scripts/build_blog.py'
      - 'scripts/test_blog_captions.py'
      - 'scripts/test_blog_highlights.py'
      - '.github/workflows/blog-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isabele-blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar sintaxe do gerador
        run: python -m py_compile scripts/build_blog.py

      - name: Testar legendas e seguranca do HTML
        run: python -m unittest discover -s scripts -p 'test_blog_*.py' -v

      - name: Gerar artigos e listagem
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "feat/blog-destaques-horizontal-20261121" ]; then
            python scripts/build_blog.py
          else
            python scripts/build_blog.py --preview
          fi

      - name: Salvar paginas atualizadas no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- blog/ sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "Blog sem modificacoes pendentes."
            exit 0
          fi
          git commit -m "blog: gerar paginas a partir do Pages CMS"
          git push origin HEAD:"$GITHUB_REF_NAME"
