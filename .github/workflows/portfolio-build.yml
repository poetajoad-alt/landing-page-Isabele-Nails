name: Isabele - gerar catálogo automático do portfólio
on:
  push:
    branches: [main]
    paths:
      - 'assets/portfolio/**'
      - 'scripts/build_portfolio.py'
      - '.github/workflows/portfolio-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isabele-portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar catálogo JSON automaticamente
        run: python scripts/build_portfolio.py
      - name: Publicar o catálogo atualizado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio/manifest.json
          if git diff --cached --quiet; then
            echo "Manifesto já atualizado."
            exit 0
          fi
          git commit -m "portfolio: sincronizar fotos automaticamente"
          git pull --rebase origin main
          git push origin HEAD:main
